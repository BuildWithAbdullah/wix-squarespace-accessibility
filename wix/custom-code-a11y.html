<!--
  Wix Custom Code block

  Settings > Custom Code > Add Custom Code
    Place code in: Body - end
    Apply to: All pages
    Load code on: Each new page

  "Each new page" matters. Wix transitions between pages without a reload, so
  "once" leaves every page after the first one unpatched.

  Read the README and docs/03-what-the-kit-cannot-reach.md first. Everything
  in here should be attempted in the Wix editor before it is attempted in
  code. What is left is what the editor genuinely cannot reach, and that is
  the only thing this block is for.

  The script is dist/a11y-bundle.js, which is generated from the sources in
  lib/, shared/ and rules/ and is regenerated by `npm run bundle`. Every rule
  in it has a failing and a corrected example and is driven in a real browser
  in CI. Paste the file inline instead of loading it from a CDN if you would
  rather not add a third party to a client site, which is usually the right
  call: it is one request and one dependency either way, and inline removes
  both.
-->

<style>
  /* Focus visibility, WCAG 2.4.7 and 2.4.11.

     Check whether the theme has suppressed outlines before assuming this is
     needed. If it has, this restores them. The !important flags are here
     because template styles load after injected ones and would otherwise
     win, and injected CSS on a closed platform is one of the few places
     !important is the correct tool rather than a smell. */
  a:focus-visible,
  button:focus-visible,
  input:focus-visible,
  select:focus-visible,
  textarea:focus-visible,
  summary:focus-visible,
  [tabindex]:focus-visible {
    outline: 3px solid #005fcc !important;
    outline-offset: 2px !important;
  }

  /* Windows high contrast mode discards author colours, so a transparent
     outline is repainted by the OS in the user's own colours. A coloured
     outline here would simply disappear. */
  @media (forced-colors: active) {
    :focus-visible { outline: 3px solid transparent !important; }
  }

  /* The class the repair rules use for hidden text. clip-path rather than
     display:none or visibility:hidden, because both of those remove the text
     from the accessibility tree as well as from the screen, which is the
     opposite of what is wanted. */
  .a11y-visually-hidden {
    position: absolute !important;
    width: 1px; height: 1px;
    margin: -1px; padding: 0;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
    border: 0;
  }

  /* Skip link. The target is resolved by the script, because the id of the
     main content region is not something the editor lets you set. */
  .a11y-skip-link {
    position: absolute;
    top: 0; left: 0;
    z-index: 100000;
    padding: 12px 16px;
    background: #ffffff;
    color: #14161a;
    text-decoration: underline;
    transform: translateY(-200%);
  }
  .a11y-skip-link:focus {
    transform: translateY(0);
    outline: 3px solid #005fcc;
    outline-offset: 2px;
  }

  /* Motion, WCAG 2.3.3. */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
      scroll-behavior: auto !important;
    }
  }
</style>

<script src="https://cdn.jsdelivr.net/gh/BuildWithAbdullah/wix-squarespace-accessibility@main/dist/a11y-bundle.js"></script>
