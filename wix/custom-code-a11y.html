<!--
  Wix Custom Code block
  Settings > Custom Code > Add Custom Code
    Place code in: Body - end
    Apply to: All pages
    Load code on: Each new page (Wix transitions between pages without a
                  reload, so "once" leaves later pages unpatched)

  Read shared/README.md first. Everything in here should be attempted in the
  Wix editor before it is attempted in code. What is left is what the editor
  genuinely cannot reach.

  Selectors deliberately avoid Wix's generated class names, which look like
  _1a2b3c and change between publishes. Structure, roles and data-testid
  attributes are far more stable.
-->

<style>
  /* Focus visibility. Check whether the theme has already suppressed outlines
     before assuming this is needed; if it has, this rule restores them. */
  a:focus-visible,
  button:focus-visible,
  input:focus-visible,
  select:focus-visible,
  textarea:focus-visible,
  [tabindex]:focus-visible {
    outline: 3px solid #005fcc !important;
    outline-offset: 2px !important;
  }

  /* Windows high contrast mode discards author colours; a transparent outline
     is repainted by the OS in the user's own colours. */
  @media (forced-colors: active) {
    :focus-visible { outline: 3px solid transparent !important; }
  }

  .a11y-visually-hidden {
    position: absolute !important;
    width: 1px; height: 1px;
    margin: -1px; padding: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    clip-path: inset(50%);
    white-space: nowrap;
    border: 0;
  }

  /* Skip link. The target is resolved by the script below, because the id of
     the main content region is not something you can rely on in the editor. */
  .a11y-skip-link {
    position: absolute;
    top: 0; left: 0;
    z-index: 100000;
    padding: 12px 16px;
    background: #ffffff;
    color: #14161a;
    transform: translateY(-200%);
  }
  .a11y-skip-link:focus {
    transform: translateY(0);
    outline: 3px solid #005fcc;
    outline-offset: 2px;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>

<script src="https://cdn.jsdelivr.net/gh/BuildWithAbdullah/wix-squarespace-accessibility@main/shared/a11y-injection-kit.js"></script>
<script>
(function () {
  'use strict';
  if (!window.A11yKit) return;

  A11yKit
    /* 1. Skip link.
       Wix does not emit one and there is no editor setting for it. The target
       needs tabindex="-1" or several browsers scroll without moving focus,
       which makes the link look like it works while doing nothing. */
    .rule('skip-link', function (root, mark) {
      if (document.querySelector('.a11y-skip-link')) return;

      var main = document.querySelector('main, [role="main"], #PAGES_CONTAINER, #SITE_PAGES');
      if (!main) return;

      if (!main.id) main.id = 'a11y-main';
      if (!main.hasAttribute('tabindex')) main.setAttribute('tabindex', '-1');

      var link = document.createElement('a');
      link.className = 'a11y-skip-link';
      link.href = '#' + main.id;
      link.textContent = 'Skip to main content';
      document.body.insertBefore(link, document.body.firstChild);
      mark(link);
    })

    /* 2. Name genuinely unnamed controls.
       Note the two guards: anything already carrying a name is left alone,
       and anything we cannot identify confidently is left alone too. A rule
       that guesses produces defects that are harder to find than the ones it
       was written to fix. */
    .rule('name-controls', function (root, mark) {
      var HINTS = [
        [/close|dismiss/i, 'Close'],
        [/search/i,        'Search'],
        [/menu|hamburger/i,'Open menu'],
        [/prev|previous/i, 'Previous'],
        [/next/i,          'Next'],
        [/play/i,          'Play'],
        [/pause/i,         'Pause']
      ];

      root.querySelectorAll('button, [role="button"], a[href]').forEach(function (el) {
        var named = el.textContent.trim() ||
                    el.getAttribute('aria-label') ||
                    el.getAttribute('title') ||
                    (el.getAttribute('aria-labelledby') &&
                     document.getElementById(el.getAttribute('aria-labelledby')));
        if (named) return;
        if (mark(el)) return;

        var probe = [el.getAttribute('data-testid'), el.getAttribute('data-hook'),
                     el.id, el.className].join(' ');

        for (var i = 0; i < HINTS.length; i++) {
          if (HINTS[i][0].test(probe)) {
            var span = document.createElement('span');
            span.className = 'a11y-visually-hidden';
            span.textContent = HINTS[i][1];
            el.appendChild(span);
            return;
          }
        }
        /* Deliberately no fallback. An unnamed control we cannot identify is
           logged for a human to name in the editor, not guessed at. */
        if (window.console) console.info('[a11y] unnamed control, name it in the editor:', el);
      })
    })

    /* 3. Decorative images that Wix emits with a filename as alt.
       Only touches values that are plainly filenames, never real prose. */
    .rule('filename-alt', function (root, mark) {
      root.querySelectorAll('img[alt]').forEach(function (img) {
        var alt = img.getAttribute('alt');
        if (!/^[\w\-. ]+\.(jpe?g|png|gif|webp|svg|avif)$/i.test(alt)) return;
        if (mark(img)) return;
        /* An alt that is a filename carries no information, so the honest
           repair is to mark it decorative and flag it for a human. It is not
           to invent a description. */
        img.setAttribute('alt', '');
        if (window.console) console.info('[a11y] filename alt cleared, set real alt in the editor:', img.src);
      });
    })

    /* 4. Cross-origin iframes: give them a name so they are not announced as
       an unlabelled frame. The contents remain unreachable. */
    .rule('name-iframes', function (root, mark) {
      root.querySelectorAll('iframe:not([title])').forEach(function (f) {
        if (mark(f)) return;
        var src = '';
        try { src = new URL(f.src, location.href).hostname; } catch (e) {}
        f.setAttribute('title', src ? ('Embedded content from ' + src) : 'Embedded content');
      });
    })

    .start();
})();
</script>
