<!--
  Squarespace: Settings > Advanced > Code Injection > HEADER

  Styles only. They belong in the header so they apply before first paint and
  the page does not flash an unstyled focus state.

  Check Site Styles first. Anything achievable there should be done there,
  because it belongs to the client and survives.
-->

<style>
  /* Focus visibility.
     Several Squarespace templates suppress outlines in their own CSS. The
     !important flags are here because template styles are loaded after
     injected header styles and would otherwise win. Injected CSS on a closed
     platform is one of the few places !important is the correct tool. */
  a:focus-visible,
  button:focus-visible,
  input:focus-visible,
  select:focus-visible,
  textarea:focus-visible,
  summary:focus-visible,
  [tabindex]:focus-visible {
    outline: 3px solid #005fcc !important;
    outline-offset: 2px !important;
  }

  /* Two-tone ring so focus stays visible on dark sections without needing a
     separate rule per section background. */
  .sqs-block-content [data-section-theme="dark"] :focus-visible,
  section[data-section-theme*="dark"] :focus-visible {
    outline-color: #ffffff !important;
    box-shadow: 0 0 0 6px rgba(0,0,0,.9), 0 0 0 9px #ffffff !important;
  }

  @media (forced-colors: active) {
    :focus-visible { outline: 3px solid transparent !important; }
  }

  /* Skip link, created by the footer script. */
  .a11y-skip-link {
    position: absolute;
    top: 0; left: 0;
    z-index: 100000;
    padding: 12px 16px;
    background: #ffffff;
    color: #14161a;
    text-decoration: underline;
    transform: translateY(-200%);
  }
  .a11y-skip-link:focus {
    transform: translateY(0);
    outline: 3px solid #005fcc;
    outline-offset: 2px;
  }

  .a11y-visually-hidden {
    position: absolute !important;
    width: 1px; height: 1px;
    margin: -1px; padding: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    clip-path: inset(50%);
    white-space: nowrap;
    border: 0;
  }

  /* Non-text contrast, WCAG 1.4.11.
     Squarespace form fields commonly use a very light bottom border, around
     1.3:1 against white. The requirement is 3:1. #767676 is 4.5:1 and looks
     almost identical at 1px. */
  .form-item input,
  .form-item textarea,
  .form-item select,
  .sqs-block-form input,
  .sqs-block-form textarea {
    border-color: #767676 !important;
  }

  /* Motion, WCAG 2.3.3. Squarespace section animations and parallax headers
     are on by default in several 7.1 sections. */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
      scroll-behavior: auto !important;
    }
    .sqs-block-image img,
    [data-animation-role] {
      opacity: 1 !important;
      transform: none !important;
    }
  }

  /* Reflow, WCAG 1.4.10. Scope horizontal scrolling to wide tables rather
     than letting it fall onto the document. */
  .sqs-block-markdown table,
  .sqs-block-html table {
    display: block;
    overflow-x: auto;
    max-width: 100%;
  }
</style>
