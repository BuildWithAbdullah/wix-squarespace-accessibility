<!--
  Squarespace: Settings > Advanced > Code Injection > FOOTER

  Scripts belong in the footer so the DOM exists when they run. Pair with
  code-injection-header.html, which supplies the styles these rules rely on.

  Squarespace uses AJAX page transitions on many templates, so a one-shot
  script does not run on the next page. The bundle observes the DOM and
  re-applies safely, which is what the whole of shared/a11y-injection-kit.js
  exists to make true.

  Read the README and docs/03-what-the-kit-cannot-reach.md first. Anything
  Site Styles or the page editor can set should be set there, because a
  setting belongs to the client and survives, while a patch belongs to
  whoever installed it, forever.

  The script is dist/a11y-bundle.js, generated from lib/, shared/ and rules/
  by `npm run bundle`. Every rule in it has a failing and a corrected example
  and is driven in a real browser in CI. Paste the file inline rather than
  loading it from a CDN if you would rather not add a third party to a client
  site. That is usually the right call.
-->

<script src="https://cdn.jsdelivr.net/gh/BuildWithAbdullah/wix-squarespace-accessibility@main/dist/a11y-bundle.js"></script>
