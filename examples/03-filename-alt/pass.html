<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Alt text set in the editor</title>
  <!--
    The corrected page, and the correction is the one only a human can make.

    The decorative image is marked decorative with an empty alt, which is a
    statement rather than an omission. The image that names a link now
    carries the link's purpose. The prose alt is unchanged.

    No script can produce the middle line, because no script knows where the
    link goes or what the picture shows. The repair rule gets as far as
    refusing to make it worse and reporting it, which is the honest ceiling
    for an injected layer and is stated as such in the README.
  -->
</head>
<body>
  <main>
    <h1>Lookbook</h1>

    <img src="dsc_0043.jpg" alt="" width="200" height="120">

    <a href="/collections/autumn">
      <img src="hero-final-2.png" alt="The autumn collection" width="200" height="120">
    </a>

    <img src="team.jpg" alt="The studio team on the stairs at the summer party" width="200" height="120">
  </main>
</body>
</html>
